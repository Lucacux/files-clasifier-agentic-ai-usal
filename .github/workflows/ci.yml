name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Formato
        run: ruff format --check .

      - name: Linter
        run: ruff check --output-format=github .

      - name: Tipos
        run: mypy src/

      - name: Tests
        run: pytest --cov=archivista --cov-report=term-missing

  shell:
    name: Scripts de shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          # Sin scripts todavía: no falla, pero valida en cuanto aparezca el primero.
          find scripts deploy -name '*.sh' -print0 2>/dev/null \
            | xargs -0 --no-run-if-empty shellcheck --severity=warning

  docs:
    name: Enlaces de la documentación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar enlaces internos rotos
        run: |
          python - <<'PY'
          import re, sys
          from pathlib import Path

          broken = []
          for md in Path(".").rglob("*.md"):
              if ".git" in md.parts:
                  continue
              for link in re.findall(r"\[[^\]]*\]\(([^)#]+)(?:#[^)]*)?\)", md.read_text()):
                  if link.startswith(("http://", "https://", "mailto:")):
                      continue
                  if not (md.parent / link).exists():
                      broken.append(f"{md}: {link}")

          if broken:
              print("Enlaces internos rotos:")
              print("\n".join(f"  - {b}" for b in broken))
              sys.exit(1)
          print("Todos los enlaces internos resuelven correctamente.")
          PY
